<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Di Sản Hồ Chí Minh – Hội Phụ Nữ Bàu Lâm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"/>
<style>
:root{--primary:#1a4fa0;--primary-light:#2563c4;--gold:#c8922a;--bg:#fafaf8;--bg2:#f2f0eb;--fg:#1a1a18;--muted:#6b6b60;--border:#e0ddd5;--card:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;font-size:15px}
h1,h2,h3{font-family:'Cormorant Garamond',serif}img{max-width:100%;display:block}button{cursor:pointer;font-family:inherit}a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,248,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.nav-brand{display:flex;flex-direction:column;gap:1px;cursor:pointer}
.nav-brand-main{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:var(--primary)}
.nav-brand-sub{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.nav-links{display:flex;gap:2px}
.nav-btn{background:none;border:none;padding:7px 13px;border-radius:6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;transition:all .2s}
.nav-btn:hover{color:var(--primary);background:rgba(26,79,160,.06)}.nav-btn.active{color:var(--primary);background:rgba(26,79,160,.1)}
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--fg);padding:4px}
.mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:var(--card);border-bottom:1px solid var(--border);z-index:99;padding:12px;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.mobile-menu.open{display:flex}
.mobile-btn{background:none;border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;letter-spacing:.04em;text-transform:uppercase}
.mobile-btn.active,.mobile-btn:hover{color:var(--primary);background:rgba(26,79,160,.08)}
.page{padding-top:64px;min-height:100vh}
.hero{padding:90px 32px 80px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(170deg,#f0f5ff 0%,#fafaf8 55%,#fff8ee 100%)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 40%,rgba(26,79,160,.06) 0%,transparent 70%),radial-gradient(ellipse 60% 50% at 80% 60%,rgba(200,146,42,.06) 0%,transparent 70%)}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;background:rgba(26,79,160,.08);border:1px solid rgba(26,79,160,.15);border-radius:100px;font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,6vw,72px);font-weight:700;line-height:1.1;color:var(--fg);margin-bottom:8px}
.hero-title-accent{color:var(--primary);display:block}
.hero-sub{font-size:clamp(14px,2vw,17px);color:var(--muted);max-width:580px;margin:20px auto 40px;line-height:1.75;font-weight:300}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:13px 30px;border-radius:8px;font-size:14px;font-weight:600;letter-spacing:.02em;transition:all .2s;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,79,160,.25)}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--fg);padding:12px 28px;border-radius:8px;font-size:14px;font-weight:500;transition:all .2s;cursor:pointer}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:rgba(26,79,160,.04)}
.section{padding:72px 32px;max-width:1120px;margin:0 auto}
.section-full{padding:72px 32px}.section-full .inner{max-width:1120px;margin:0 auto}
.section-alt{background:var(--bg2)}
.section-header{text-align:center;margin-bottom:48px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;background:rgba(26,79,160,.08);border-radius:100px;font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.eyebrow-gold{background:rgba(200,146,42,.1);color:var(--gold)}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,4vw,40px);font-weight:700;color:var(--fg);line-height:1.2;margin-bottom:12px}
.section-desc{font-size:15px;color:var(--muted);max-width:560px;margin:0 auto;line-height:1.7;font-weight:300}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
@media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-3,.grid-2{grid-template-columns:1fr}.nav-links{display:none}.hamburger{display:block}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .25s;cursor:pointer}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 36px rgba(26,79,160,.1);border-color:rgba(26,79,160,.25)}
.card-img{height:190px;background:linear-gradient(135deg,#e8f0fb,#fdf6e3);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;object-position:top}
.badge-hot{position:absolute;top:12px;right:12px;background:#fbbf24;color:#713f12;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px}
.card-body{padding:18px 20px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;background:rgba(26,79,160,.07);color:var(--primary);letter-spacing:.05em;text-transform:uppercase}
.tag-gold{background:rgba(200,146,42,.1);color:var(--gold)}.tag-green{background:rgba(22,163,74,.08);color:#15803d}
.card-year{font-size:11px;color:var(--muted)}
.card-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--fg);margin-bottom:3px;line-height:1.3}
.card-role{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:10px;line-height:1.4}
.card-desc{font-size:13px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
.card-link{font-size:13px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:5px}
.card-link-arrow{transition:transform .2s}.card:hover .card-link-arrow{transform:translateX(4px)}
/* TIMELINE */
.timeline-preview{overflow-x:auto;padding:16px 0 8px;-webkit-overflow-scrolling:touch}
.vtl{position:relative;padding:8px 0}
.vtl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--primary) 0%,var(--gold) 100%);transform:translateX(-50%);opacity:.3}
.vt-row{display:grid;grid-template-columns:1fr 48px 1fr;gap:0;margin-bottom:40px;align-items:start}
.vt-left{padding-right:28px;text-align:right}.vt-right{padding-left:28px}
.vt-center{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.vt-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex-shrink:0;margin-top:4px}
.vt-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all .2s}
.vt-card:hover{border-color:rgba(26,79,160,.3);box-shadow:0 6px 20px rgba(26,79,160,.08)}
.vt-img{width:100%;height:150px;object-fit:cover;display:block}
.vt-card-body{padding:20px}
.vt-year{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--primary);line-height:1;margin-bottom:6px}
.vt-cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 10px;border-radius:100px;margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase}
.cat-cd{background:#dbeafe;color:#1d4ed8}.cat-sn{background:#dcfce7;color:#166534}.cat-tt{background:#ede9fe;color:#6d28d9}.cat-ds{background:#fef9c3;color:#854d0e}
.vt-place{font-size:11px;color:var(--muted);margin-bottom:6px}
.vt-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:var(--fg);margin-bottom:8px;line-height:1.3}
.vt-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.vt-note{font-size:12px;color:var(--primary);font-style:italic;padding-left:10px;border-left:2px solid rgba(26,79,160,.25);line-height:1.6}
.vt-ext-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--primary);background:rgba(26,79,160,.08);padding:7px 14px;border-radius:6px;margin-top:12px;transition:background .2s}
.vt-ext-link:hover{background:rgba(26,79,160,.15)}
@media(max-width:600px){
  .vtl::before{left:20px}
  .vt-row{display:flex;flex-direction:row;gap:12px;align-items:flex-start;margin-bottom:28px}
  .vt-left{display:none}
  .vt-center{flex-shrink:0;width:24px;display:flex;flex-direction:column;align-items:center;padding-top:8px}
  .vt-right{flex:1;padding-left:0}
}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.tab-btn{background:none;border:1px solid var(--border);padding:7px 18px;border-radius:100px;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;letter-spacing:.03em}
.tab-btn:hover,.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .25s;cursor:pointer}
.tp-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tp-cover{height:200px;display:flex;align-items:center;justify-content:center;font-size:68px;background:linear-gradient(135deg,#e8f0fb,#fdf6e3);overflow:hidden}
.tp-cover img{width:100%;height:100%;object-fit:cover;object-position:top center}
.tp-body{padding:18px 20px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,15,15,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--card);border-radius:18px;padding:32px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;position:relative;animation:slidein .25s;box-shadow:0 24px 60px rgba(0,0,0,.18)}
@keyframes slidein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--border);color:var(--fg)}
.modal-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--fg);margin-bottom:4px}
.modal-role{font-size:13px;color:var(--primary);font-weight:600;margin-bottom:14px;line-height:1.5;white-space:pre-line}
.modal-section{margin-top:18px}
.modal-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.modal-text{font-size:13px;color:var(--fg);line-height:1.8;white-space:pre-line}
.toast{position:fixed;bottom:90px;right:28px;z-index:300;background:#1a1a18;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;animation:fadein .25s}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-number{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:var(--primary);line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}
.hpn-banner{background:linear-gradient(135deg,var(--primary) 0%,#1a3a80 100%);color:#fff;padding:72px 32px;text-align:center;position:relative;overflow:hidden}
/* CONTACT BOX */
.contact-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;margin-top:48px}
.contact-box-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--fg);margin-bottom:24px}
.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(max-width:600px){.contact-grid{grid-template-columns:1fr}}
.ci-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.ci-value{font-size:13px;color:var(--fg);line-height:1.7}
.fb-btn{display:inline-flex;align-items:center;gap:8px;background:#1877f2;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:all .2s;margin-top:24px}
.fb-btn:hover{background:#1565d8;transform:translateY(-1px)}
.empty{text-align:center;padding:72px 24px}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.5}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--fg);margin-bottom:8px}
.gift-float{position:fixed;bottom:28px;right:28px;z-index:90;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#fff;border:none;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(200,146,42,.4);transition:transform .2s}
.gift-float:hover{transform:scale(1.12) rotate(-10deg)}
.view-more{text-align:center;margin-top:36px}
</style>
</head>

    chi_tiet:"Phẩm chất tiêu biểu\nGương mẫu học tập theo tư tưởng Hồ Chí Minh, lối sống giản dị, chân thành, luôn bám sát địa bàn và lắng nghe tâm tư của hội viên.\n\nHoạt động phong trào\nTích cực phối hợp dọn vệ sinh, diệt lăng quăng phòng dịch, treo cờ dịp lễ Tết và hỗ trợ đắc lực cho công tác bầu cử tại ấp.\n\nAn sinh xã hội\nVận động mạnh thường quân tặng học bổng cho con em hội viên; tích cực tham gia các hoạt động cứu trợ đồng bào bị thiên tai.\n\nMô hình điểm duy trì\nDuy trì tổ tiết kiệm 20 triệu đồng (giúp 2 chị phát triển kinh tế), xây dựng 'Ngôi nhà xanh không đồng' và lập CLB dân vũ 8 thành viên.\n\nPhương hướng năm 2026\nPhấn đấu xây dựng nông thôn mới kiểu mẫu qua các mô hình 'Gia đình 5 không 3 sạch 3 an', '100% tham gia BHYT' và phong trào 'Dân vận khéo'.",

const PAGES=["trang-chu","guong-sang","hanh-trinh","tac-pham","hoi-phu-nu"];
const PAGE_LABELS=["Trang Chủ","Gương Sáng","Hành Trình","Tác Phẩm","Hội Phụ Nữ"];
const catClass={"Cuộc Đời":"cat-cd","Sự Nghiệp":"cat-sn","Tư Tưởng":"cat-tt","Di Sản":"cat-ds"};
const dotColors={"Cuộc Đời":"#1a4fa0","Sự Nghiệp":"#16a34a","Tư Tưởng":"#7c3aed","Di Sản":"#c8922a"};

/* ============================================================  STATE  ============================================================ */
let state={page:"trang-chu",modal:null,menuOpen:false,toast:null,toastTimer:null,imgErrors:{}, isAdmin: localStorage.getItem("isAdmin") === "true"};
function setState(p){Object.assign(state,p);render();}
function goTo(p){setState({page:p,menuOpen:false});window.scrollTo({top:0,behavior:"smooth"});}
function openModal(i){setState({modal:i});}function closeModal(){setState({modal:null});}
function showToast(m){if(state.toastTimer)clearTimeout(state.toastTimer);const t=setTimeout(()=>setState({toast:null,toastTimer:null}),3000);setState({toast:m,toastTimer:t});}
function markImgError(k){const e=Object.assign({},state.imgErrors);e[k]=true;setState({imgErrors:e});}

/* ============================================================  HELPERS  ============================================================ */
function el(tag,props,...ch){
  const e=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==="className")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  ch.flat(Infinity).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}
function div(cls,...ch){return el("div",{className:cls},...ch);}
function span(cls,txt){const s=el("span",{className:cls});s.textContent=txt;return s;}
function btn(cls,label,onclick){const b=el("button",{className:cls,onClick:onclick});b.textContent=label;return b;}

/* ============================================================  MODAL  ============================================================ */
function renderModal(){
  const item=state.modal;if(!item)return null;
  const overlay=div("modal-overlay");
  overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
  
  const box=div("modal-box");
  const closeBtn=el("button",{className:"modal-close",onClick:closeModal});
  closeBtn.textContent="✕";
  box.appendChild(closeBtn);

  // MẸO CHỐNG LỖI: Tự động nhận diện dữ liệu dựa trên Trang hiện tại nếu thiếu _type
  const isGuong = item._type === "guong" || state.page === "guong-sang";
  const isTacPham = item._type === "tacpham" || state.page === "tac-pham";
  const isHoiPhuNu = item._type === "hoiphunu" || state.page === "hoi-phu-nu";

  if(isGuong){
    const hasImg=item.anh&&!state.imgErrors["guong_"+item.id];
    if(hasImg){
      const img=el("img",{src:item.anh,alt:item.ten,style:{width:"90px",height:"90px",borderRadius:"50%",objectFit:"cover",objectPosition:"top",marginBottom:"16px",border:"3px solid var(--border)"}});
      img.onerror=()=>markImgError("guong_"+item.id);box.appendChild(img);
    } else {
      const emo=div(""); emo.style.cssText="font-size:56px;margin-bottom:16px"; emo.textContent="👤"; box.appendChild(emo);
    }
    const name=div("modal-name");name.textContent=item.ten;box.appendChild(name);
    const role=div("modal-role");role.textContent=item.chuc_danh;box.appendChild(role);
    const tags=div("card-tags");
    tags.appendChild(span("tag",item.loai));
    tags.appendChild(span("tag tag-gold","Năm "+item.nam));
    box.appendChild(tags);
    const sec1=div("modal-section");
    const l1=div("modal-section-label");l1.textContent="Giới thiệu";sec1.appendChild(l1);
    const p1=div("modal-text");p1.textContent=item.mo_ta;sec1.appendChild(p1);box.appendChild(sec1);
    if(item.chi_tiet){
      const sec2=div("modal-section");
      const l2=div("modal-section-label");l2.textContent="Chi tiết thành tích";sec2.appendChild(l2);
      const p2=div("modal-text");p2.textContent=item.chi_tiet;sec2.appendChild(p2);box.appendChild(sec2);
    }
    if(item.bai_bao){
      const secBb=div("modal-section");secBb.style.marginTop="24px";
      const a=el("a",{href:item.bai_bao,target:"_blank",className:"btn-primary",style:"display:flex;justify-content:center;width:100%;"});
      a.textContent="📰 Đọc bài báo về ông Lê Đình Dũng";secBb.appendChild(a);box.appendChild(secBb);
    }

  } else if(isTacPham){
    const hasImg=item.anh_bia&&!state.imgErrors["tp_"+item.id];
    if(hasImg){
      const img=el("img",{src:item.anh_bia,alt:item.ten,style:{width:"120px",borderRadius:"8px",marginBottom:"16px",boxShadow:"0 4px 16px rgba(0,0,0,.15)"}});
      img.onerror=()=>markImgError("tp_"+item.id);box.appendChild(img);
    } else {
      const emo=div("");emo.style.cssText="font-size:56px;margin-bottom:16px";emo.textContent=item.bieu_tuong||"📖";box.appendChild(emo);
    }
    const name=div("modal-name");name.textContent=item.ten;box.appendChild(name);
    const role=div("modal-role");role.textContent="— "+item.tac_gia+" · "+item.nam;box.appendChild(role);

    const tags=div("card-tags");

    }
    box.appendChild(tags);

    const sec=div("modal-section");
    const l1=div("modal-section-label");l1.textContent="Nội dung chi tiết";sec.appendChild(l1);
    
    const p=div("modal-text");
    p.textContent = item.mo_ta || "Chưa có nội dung chi tiết cho hoạt động này.";
    sec.appendChild(p);

    // Xử lý nút Link an toàn
    const linkUrl = item.link || "";
    if(linkUrl.length > 0){
      // Đảm bảo linkUrl là string thì mới dùng .includes được, tránh lỗi trắng màn hình
      const linkString = String(linkUrl);
      const isYoutube = linkString.includes("youtube.com") || linkString.includes("youtu.be");

  overlay.appendChild(box);return overlay;

function renderTimelinePreview(){
  const pts=DATA_HANH_TRINH.slice(0,10);
  const W=900,PAD=50;const step=(W-PAD*2)/(pts.length-1);
  const ys=[65,120,60,125,60,120,65,120,65,120];
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox","0 0 900 200");svg.style.cssText="min-width:900px;width:100%;display:block;height:200px";
  const poly=document.createElementNS(svgNS,"polyline");
  poly.setAttribute("points",pts.map((_,i)=>`${PAD+i*step},${ys[i]}`).join(" "));
  poly.setAttribute("fill","none");poly.setAttribute("stroke","#1a4fa0");poly.setAttribute("stroke-width","1.5");poly.setAttribute("stroke-dasharray","6 4");poly.setAttribute("opacity",".4");svg.appendChild(poly);
  pts.forEach((p,i)=>{
    const x=PAD+i*step,y=ys[i],top=y<100;
    const dc=dotColors[p.cat]||"#1a4fa0";
    const g=document.createElementNS(svgNS,"g");g.style.cursor="pointer";
    g.addEventListener("click",()=>goTo("hanh-trinh"));
    const c1=document.createElementNS(svgNS,"circle");c1.setAttribute("cx",x);c1.setAttribute("cy",y);c1.setAttribute("r",8);c1.setAttribute("fill",dc);c1.setAttribute("stroke","#fff");c1.setAttribute("stroke-width",2);
    const c2=document.createElementNS(svgNS,"circle");c2.setAttribute("cx",x);c2.setAttribute("cy",y);c2.setAttribute("r",12);c2.setAttribute("fill","none");c2.setAttribute("stroke",dc);c2.setAttribute("stroke-width",1);c2.setAttribute("opacity",".3");
    const t1=document.createElementNS(svgNS,"text");t1.setAttribute("x",x);t1.setAttribute("y",top?y-18:y+22);t1.setAttribute("text-anchor","middle");t1.setAttribute("font-size",11);t1.setAttribute("font-weight",700);t1.setAttribute("fill","#1a4fa0");t1.setAttribute("font-family","'Be Vietnam Pro',sans-serif");t1.textContent=p.ngan;
    const t2=document.createElementNS(svgNS,"text");t2.setAttribute("x",x);t2.setAttribute("y",top?y-30:y+34);t2.setAttribute("text-anchor","middle");t2.setAttribute("font-size",9);t2.setAttribute("fill","#6b6b60");t2.setAttribute("font-family","'Be Vietnam Pro',sans-serif");t2.textContent=p.tieu_de.length>20?p.tieu_de.slice(0,18)+"…":p.tieu_de;
    g.appendChild(c2);g.appendChild(c1);g.appendChild(t1);g.appendChild(t2);svg.appendChild(g);
  });
  const wrap=div("timeline-preview");wrap.appendChild(svg);return wrap;
}

const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbwHfAV9fCSGjeUsfkgxMnS-L47La9tG9UzYAUmvgnIA1orFFzxyOglqiUX8eGWrV-8/exec";
let DYNAMIC_HOI_PHU_NU = [];

function fetchDataFromGoogleSheet() {
  fetch(GOOGLE_SHEET_API)
    .then(res => res.json())
    .then(data => {
      if (Array.isArray(data)) {
        // Lật ngược danh sách để bài mới đăng lên Sheet nhảy lên đầu trang web
        DYNAMIC_HOI_PHU_NU = data.reverse();
        
        // Nếu người dùng đang đứng ở tab hội phụ nữ thì tự động render lại giao diện
        if (typeof state !== 'undefined' && state.page === "hoi-phu-nu") {
          render(); 
        }
      }
    })
    .catch(err => console.error("Lỗi đồng bộ dữ liệu Google Sheet:", err));
}

// Chạy tự động ngay khi tải trang web lần đầu
fetchDataFromGoogleSheet();

// Hàm xử lý đẩy bài viết mới lên Google Sheet khi bấm nút Đăng
function handleCreatePost() {
  const titleInput = document.getElementById("post-title");
  const catInput = document.getElementById("post-category");
  const descInput = document.getElementById("post-desc");
  const linkInput = document.getElementById("post-link");
  const btnSubmit = document.getElementById("btn-submit-post");

  if (!titleInput || !descInput || !btnSubmit) return;

  const title = titleInput.value.trim();
  const desc = descInput.value.trim();

  if (!title || !desc) {
    alert("Vui lòng nhập đầy đủ Tiêu đề và Nội dung mô tả hoạt động!");
    return;
  }

  btnSubmit.disabled = true;
  btnSubmit.textContent = "⚡ Đang xử lý đăng bài...";

  const newPost = {
    id: Date.now(),
    tieu_de: title,
    the_loai: catInput.value,
    ngay: new Date().toLocaleDateString("vi-VN"), // Tự động lấy ngày hôm nay
    mo_ta: desc,
    link: linkInput.value.trim(),
    anh: "" // Tạm thời để trống
  };

  fetch(GOOGLE_SHEET_API, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(newPost)
  })
  .then(() => {
    alert("🎉 Đăng bài thành công! Dữ liệu đã được lưu trữ an toàn.");
    titleInput.value = "";
    descInput.value = "";
    linkInput.value = "";
    // Đợi 1 giây cho dữ liệu ổn định rồi kéo danh sách mới về
    setTimeout(fetchDataFromGoogleSheet, 1000);
  })
  .catch(err => {
    console.error(err);
    alert("Đã xảy ra lỗi mạng khi kết nối cơ sở dữ liệu!");
  })
  .finally(() => {
    btnSubmit.disabled = false;
    btnSubmit.textContent = "Đăng bài lên hệ thống";
  });
}

  // Những bài mặc định (ID nhỏ hơn 1000) nằm trong code thì không xóa được qua Sheet
  if (id < 1000) {
    alert("⚠️ Đây là bài viết mặc định lưu trong Code. Bạn không thể xóa tự động mà phải xóa trong file index.html.");
    return;
  }
  
  // Bảng cảnh báo chống xóa nhầm
  if (!confirm("⚠️ CẢNH BÁO: Bạn có chắc chắn muốn XÓA bài viết này không? Hành động này không thể hoàn tác!")) {
    return;
  }

  // Bắn tín hiệu xóa lên Google Sheet
  fetch(GOOGLE_SHEET_API, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "delete", id: id })
  })
  .then(() => {
    alert("🗑️ Đã xóa bài viết thành công!");
    setTimeout(fetchDataFromGoogleSheet, 1000); // Tải lại danh sách sau khi xóa
  })
  .catch(err => {
    console.error(err);
    alert("Đã xảy ra lỗi mạng!");
  });
}

// ============================================================
// HÀM HIỂN THỊ TAB HỘI PHỤ NỮ (GỘP BÀI MỚI + BÀI CÓ SẴN)
// ============================================================
function renderHoiPhuNu() {
  const container = div("section animate-fade");

  // THANH CÔNG CỤ QUẢN TRỊ (NÚT ĐĂNG NHẬP/ĐĂNG XUẤT)
  const adminBar = div("");
  adminBar.style.cssText = "display: flex; justify-content: flex-end; margin-bottom: 20px;";
  if (state.isAdmin) {
    adminBar.innerHTML = `<button onclick="logoutAdmin()" style="background:#dc2626; color:white; padding:8px 16px; border-radius:6px; border:none; font-weight:bold; cursor:pointer;">🔓 Đăng xuất Quản trị</button>`;
  } else {
    adminBar.innerHTML = `<button onclick="loginAdmin()" style="background:var(--bg2); color:var(--muted); padding:8px 16px; border-radius:6px; border:1px solid var(--border); font-weight:bold; cursor:pointer;">🔒 Dành cho Quản trị viên</button>`;
  }
  container.appendChild(adminBar);

  // KHỐI 1: FORM ĐĂNG BÀI (CHỈ HIỆN KHI LÀ ADMIN)
  if (state.isAdmin) {
    const formBox = div("");
    formBox.style.cssText = "background:var(--card); border:2px dashed var(--primary); padding:20px; border-radius:12px; margin-bottom:30px;";
    formBox.innerHTML = `
      <h3 style="margin-top:0; margin-bottom:15px; color:var(--primary); font-size:20px; font-family:'Cormorant Garamond',serif; font-weight:700;">✍️ Khu vực Quản trị: Đăng Hoạt Động Mới</h3>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <label style="font-size:13px; font-weight:600; margin-bottom:-8px; color:var(--fg)">Tải ảnh đại diện (Không bắt buộc)</label>
        <input type="file" id="post-image" accept="image/*" style="padding:10px; border:1px dashed var(--border); border-radius:6px; background:var(--bg2);">
        <input type="text" id="post-title" placeholder="Tiêu đề hoạt động..." style="padding:10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; width:100%; background:var(--card); color:var(--fg);">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <select id="post-category" style="padding:10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; width:100%; background:var(--card); color:var(--fg);">
            <option value="Hoạt Động">Hoạt Động</option>
            <option value="Phong Trào">Phong Trào</option>
            <option value="Mô Hình">Mô Hình</option>
          </select>
          <input type="text" id="post-time" placeholder="Thời gian (VD: Tháng 5/2026)..." style="padding:10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; width:100%; background:var(--card); color:var(--fg);">
        </div>
        <textarea id="post-desc" placeholder="Mô tả nội dung chi tiết..." rows="3" style="padding:10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; width:100%; resize:vertical; background:var(--card); color:var(--fg);"></textarea>
        <input type="text" id="post-link" placeholder="Link video YouTube hoặc Facebook (nếu có)..." style="padding:10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; width:100%; background:var(--card); color:var(--fg);">
        <button id="btn-submit-post" onclick="handleCreatePost()" style="background:var(--primary); color:white; border:none; padding:12px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer;">Đăng bài lên hệ thống</button>
      </div>
    `;
    container.appendChild(formBox);
  }

  // KHỐI 2: TIÊU ĐỀ TRANG
  const h2Title = document.createElement("h2");
  h2Title.className = "section-title";
  h2Title.textContent = "Hoạt Động Hội Phụ Nữ Xã Bàu Lâm";
  container.appendChild(h2Title);

  // KHỐI 3: LƯỚI DANH SÁCH BÀI VIẾT
  const grid = div("grid-3");
  const totalList = [...DYNAMIC_HOI_PHU_NU, ...DATA_HOI_PHU_NU];

  totalList.forEach(item => {
    const card = div("card");
    card.addEventListener("click", e => {
      if(e.target.closest("a") || e.target.closest("button")) return; // Tránh lỗi khi bấm vào link/nút xóa
      openModal({...item, _type:"hoiphunu"});
    });

    const imgW = div("card-img");
    if (item.anh && item.anh.trim() !== "") {
      const imgObj = document.createElement("img");
      imgObj.src = item.anh;
      imgObj.alt = item.tieu_de || "";
      imgObj.style.width = "100%";
      imgObj.style.height = "100%";
      imgObj.style.objectFit = "cover";
      imgW.appendChild(imgObj);
    } else {
      imgW.textContent = "📰";
      imgW.style.fontSize = "48px";
      imgW.style.display = "flex";
      imgW.style.alignItems = "center";
      imgW.style.justifyContent = "center";
      imgW.style.background = "var(--bg2)";
    }
    card.appendChild(imgW);

    const body = div("card-body");
    const meta = div("card-meta");
    meta.innerHTML = `<span class="badge">${item.the_loai}</span><span style="font-size:12px; color:var(--muted); margin-left:8px;">${item.ngay}</span>`;
    body.appendChild(meta);

    const titleObj = document.createElement("h3");
    titleObj.className = "card-name";
    titleObj.style.marginTop = "8px";
    titleObj.textContent = item.tieu_de;
    body.appendChild(titleObj);

    const descObj = document.createElement("p");
    descObj.className = "card-desc";
    descObj.textContent = item.mo_ta;
    body.appendChild(descObj);

    // KẾT HỢP NÚT LINK VÀ NÚT XÓA BÀI (NẾU LÀ ADMIN)
    const lnkFlex = div(""); 
    lnkFlex.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin-top:14px;";
    
    // Khối chứa nút Link
    const leftLinks = div("");
    leftLinks.style.cssText = "display:flex; gap: 8px;";
    
    if (item.link && item.link.trim() !== "") {
      const isYoutube = item.link.includes("youtube.com") || item.link.includes("youtu.be");
      const aLink = document.createElement("a");
      aLink.href = item.link;
      aLink.target = "_blank";
      aLink.style.cssText = `display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:${isYoutube ? '#ff0000' : '#1877f2'}; background:${isYoutube ? 'rgba(255,0,0,.08)' : 'rgba(24,119,242,.08)'}; padding:4px 10px; border-radius:6px; text-decoration:none;`;
      aLink.innerHTML = isYoutube ? `▶️ Video` : `📰 Nguồn`;
      leftLinks.appendChild(aLink);
    }
    lnkFlex.appendChild(leftLinks);

    // Nút XÓA BÀI (Chỉ hiển thị khi đã nhập đúng mật khẩu Quản Trị)
    if (state.isAdmin) {
      const delBtn = document.createElement("button");
      delBtn.textContent = "🗑️ Xóa";
      delBtn.style.cssText = "background:none; border:1px solid #dc2626; color:#dc2626; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;";
      delBtn.onclick = (e) => {
        e.stopPropagation(); // Không cho phép popup hiện lên khi đang bấm nút xóa
        handleDeletePost(item.id);
      };
      lnkFlex.appendChild(delBtn);
    }

    body.appendChild(lnkFlex);
    card.appendChild(body);
    grid.appendChild(card);
  });

  container.appendChild(grid);
  return container;
}

/* ============================================================  NAV / FOOTER  ============================================================ */
function renderNav(){
  const nav=el("nav",{className:"nav"});
  const brand=div("nav-brand");brand.addEventListener("click",()=>goTo("trang-chu"));
  const bm=div("nav-brand-main");bm.textContent="Di Sản Hồ Chí Minh";
  const bs=div("nav-brand-sub");bs.textContent="Hội Phụ Nữ Bàu Lâm";
  brand.appendChild(bm);brand.appendChild(bs);
  const links=div("nav-links");
  PAGES.forEach((p,i)=>{const b=btn("nav-btn"+(state.page===p?" active":""),PAGE_LABELS[i],()=>goTo(p));links.appendChild(b);});
  const ham=el("button",{className:"hamburger",onClick:()=>setState({menuOpen:!state.menuOpen})});ham.textContent="☰";
  nav.appendChild(brand);nav.appendChild(links);nav.appendChild(ham);return nav;
}
function renderMobileMenu(){
  if(!state.menuOpen)return null;
  const menu=div("mobile-menu open");
  PAGES.forEach((p,i)=>{const b=btn("mobile-btn"+(state.page===p?" active":""),PAGE_LABELS[i],()=>goTo(p));menu.appendChild(b);});
  return menu;
}
function renderFooter(){
  const ft=el("footer",{});
  ft.style.cssText="background:#1a1a18;color:rgba(255,255,255,.6);padding:52px 32px 24px";
  ft.innerHTML=`<div style="max-width:1120px;margin:0 auto">
    <div style="display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px;margin-bottom:36px">
      <div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:10px">Di Sản Hồ Chí Minh</div>
        <div style="font-size:13px;line-height:1.7;max-width:280px;margin-bottom:16px">Không gian số hóa tư liệu lịch sử và biểu dương gương sáng học tập theo tư tưởng Hồ Chí Minh của Hội Phụ nữ xã Bàu Lâm.</div>
        <div style="font-size:12px;line-height:1.8">
          <div>📍 Ấp 2 Đông, Xã Bàu Lâm, Thành phố Hồ Chí Minh</div>
          <div style="margin-top:4px">🌸 Hội liên hiệp phụ nữ xã Bàu Lâm - Thành phố Hồ Chí Minh</div>
        </div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:12px">Liên Kết Nhanh</div>
        ${PAGES.map((p,i)=>`<button onclick="goTo('${p}')" style="display:block;font-size:13px;color:rgba(255,255,255,.55);margin-bottom:8px;background:none;border:none;text-align:left;cursor:pointer;font-family:inherit;padding:0">${PAGE_LABELS[i]}</button>`).join("")}
      </div>
      <div style="display:none;">
      </div>
    </div>
    <div style="border-top:1px solid rgba(255,255,255,.08);padding-top:20px;font-size:12px;text-align:center">
      © ${new Date().getFullYear()} Hội Phụ Nữ Bàu Lâm · Xuyên Mộc · Bà Rịa-Vũng Tàu. Tất cả quyền được bảo lưu.
    </div>
  </div>`;
  return ft;
}

/* ============================================================  RENDER  ============================================================ */
function render(){
  const root=document.getElementById("root");root.innerHTML="";
  root.appendChild(renderNav());
  const mm=renderMobileMenu();if(mm)root.appendChild(mm);
  const wrap=div("page");
  if(state.page==="trang-chu")wrap.appendChild(renderTrangChu());
  else if(state.page==="guong-sang")wrap.appendChild(renderGuongSang());
  else if(state.page==="hanh-trinh")wrap.appendChild(renderHanhTrinh());
  else if(state.page==="tac-pham")wrap.appendChild(renderTacPham());
  else if(state.page==="hoi-phu-nu")wrap.appendChild(renderHoiPhuNu());
  root.appendChild(wrap);root.appendChild(renderFooter());
  const modal=renderModal();if(modal)root.appendChild(modal);
  if(state.toast){const t=div("toast");t.textContent="🌸 "+state.toast;root.appendChild(t);}
  const gf=el("button",{className:"gift-float",onClick:()=>showToast("Tính năng tải tài liệu sẽ sớm ra mắt! 🎁")});gf.textContent="🎁";root.appendChild(gf);
}
render();
</script>
