<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Di Sản Hồ Chí Minh – Bầu Lâm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --primary: #1a4fa0;
  --primary-light: #2563c4;
  --gold: #c8922a;
  --gold-light: #f0c060;
  --bg: #fafaf8;
  --bg2: #f2f0eb;
  --fg: #1a1a18;
  --muted: #6b6b60;
  --border: #e0ddd5;
  --card: #ffffff;
  --red: #c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;font-size:15px}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
img{max-width:100%;display:block}
button{cursor:pointer;font-family:inherit}
a{color:inherit;text-decoration:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,248,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.nav-brand{display:flex;flex-direction:column;gap:1px}
.nav-brand-main{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:var(--primary);letter-spacing:0.01em}
.nav-brand-sub{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em}
.nav-links{display:flex;gap:2px}
.nav-btn{background:none;border:none;padding:7px 13px;border-radius:6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;transition:all .2s}
.nav-btn:hover{color:var(--primary);background:rgba(26,79,160,0.06)}
.nav-btn.active{color:var(--primary);background:rgba(26,79,160,0.1)}
.nav-flag{font-size:18px;line-height:1}
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--fg);padding:4px}
.mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:var(--card);border-bottom:1px solid var(--border);z-index:99;padding:12px;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.mobile-menu.open{display:flex}
.mobile-btn{background:none;border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;letter-spacing:0.04em;text-transform:uppercase}
.mobile-btn.active,.mobile-btn:hover{color:var(--primary);background:rgba(26,79,160,0.08)}

/* PAGES */
.page{padding-top:64px;min-height:100vh}

/* HERO */
.hero{padding:90px 32px 80px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(170deg,#f0f5ff 0%,#fafaf8 55%,#fff8ee 100%)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 40%,rgba(26,79,160,0.06) 0%,transparent 70%),radial-gradient(ellipse 60% 50% at 80% 60%,rgba(200,146,42,0.06) 0%,transparent 70%)}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;background:rgba(26,79,160,0.08);border:1px solid rgba(26,79,160,0.15);border-radius:100px;font-size:11px;font-weight:700;color:var(--primary);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:28px}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,6vw,72px);font-weight:700;line-height:1.1;color:var(--fg);margin-bottom:8px}
.hero-title-accent{color:var(--primary);display:block}
.hero-sub{font-size:clamp(14px,2vw,17px);color:var(--muted);max-width:580px;margin:20px auto 40px;line-height:1.75;font-weight:300}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:13px 30px;border-radius:8px;font-size:14px;font-weight:600;letter-spacing:0.02em;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,79,160,0.25)}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--fg);padding:12px 28px;border-radius:8px;font-size:14px;font-weight:500;transition:all .2s}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:rgba(26,79,160,0.04)}

/* SECTION */
.section{padding:72px 32px;max-width:1120px;margin:0 auto}
.section-full{padding:72px 32px}
.section-full .inner{max-width:1120px;margin:0 auto}
.section-alt{background:var(--bg2)}
.section-dark{background:var(--primary);color:#fff}

.section-header{text-align:center;margin-bottom:48px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;background:rgba(26,79,160,0.08);border-radius:100px;font-size:11px;font-weight:700;color:var(--primary);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px}
.eyebrow-gold{background:rgba(200,146,42,0.1);color:var(--gold)}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,4vw,40px);font-weight:700;color:var(--fg);line-height:1.2;margin-bottom:12px}
.section-desc{font-size:15px;color:var(--muted);max-width:560px;margin:0 auto;line-height:1.7;font-weight:300}
.section-dark .section-title{color:#fff}
.section-dark .section-desc{color:rgba(255,255,255,0.7)}

/* GRID */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
@media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-3,.grid-2{grid-template-columns:1fr}.nav-links{display:none}.hamburger{display:block}}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .25s;cursor:pointer}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 36px rgba(26,79,160,0.1);border-color:rgba(26,79,160,0.25)}
.card-img{height:190px;background:linear-gradient(135deg,#e8f0fb,#fdf6e3);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;object-position:top}
.badge-hot{position:absolute;top:12px;right:12px;background:#fbbf24;color:#713f12;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;display:flex;align-items:center;gap:4px}
.card-body{padding:18px 20px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;background:rgba(26,79,160,0.07);color:var(--primary);letter-spacing:0.05em;text-transform:uppercase}
.tag-gold{background:rgba(200,146,42,0.1);color:var(--gold)}
.tag-green{background:rgba(22,163,74,0.08);color:#15803d}
.card-year{font-size:11px;color:var(--muted);font-weight:400}
.card-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--fg);margin-bottom:3px;line-height:1.3}
.card-role{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:10px;line-height:1.4}
.card-desc{font-size:13px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
.card-link{font-size:13px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:5px}
.card-link-arrow{transition:transform .2s}
.card:hover .card-link-arrow{transform:translateX(4px)}

/* TIMELINE ZIGZAG (home preview) */
.timeline-preview{overflow-x:auto;padding:16px 0 8px;-webkit-overflow-scrolling:touch}
.timeline-preview::-webkit-scrollbar{height:4px}

/* VERTICAL TIMELINE */
.vtl{position:relative;padding:8px 0}
.vtl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--primary) 0%,var(--gold) 100%);transform:translateX(-50%);opacity:0.3}
.vt-row{display:grid;grid-template-columns:1fr 48px 1fr;gap:0;margin-bottom:40px;align-items:start}
.vt-left{padding-right:28px;text-align:right}
.vt-right{padding-left:28px}
.vt-center{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.vt-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--primary);flex-shrink:0;margin-top:4px}
.vt-line{flex:1;width:1px;min-height:20px}
.vt-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:all .2s}
.vt-card:hover{border-color:rgba(26,79,160,0.3);box-shadow:0 6px 20px rgba(26,79,160,0.08)}
.vt-year{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--primary);line-height:1;margin-bottom:6px}
.vt-cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 10px;border-radius:100px;margin-bottom:8px;letter-spacing:0.05em;text-transform:uppercase}
.cat-cd{background:#dbeafe;color:#1d4ed8}
.cat-sn{background:#dcfce7;color:#166534}
.cat-tt{background:#ede9fe;color:#6d28d9}
.cat-ds{background:#fef9c3;color:#854d0e}
.vt-place{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:400}
.vt-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:var(--fg);margin-bottom:8px;line-height:1.3}
.vt-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.vt-note{font-size:12px;color:var(--primary);font-style:italic;padding-left:10px;border-left:2px solid rgba(26,79,160,0.25);line-height:1.6}
@media(max-width:600px){
  .vtl::before{left:24px}
  .vt-row{grid-template-columns:24px 1fr;gap:0}
  .vt-left{display:none}
  .vt-right{padding-left:16px}
  .vt-center{align-items:center}
}

/* FILTER TABS */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.tab-btn{background:none;border:1px solid var(--border);padding:7px 18px;border-radius:100px;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;letter-spacing:0.03em}
.tab-btn:hover,.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* TAC PHAM CARD */
.tp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .25s;cursor:pointer}
.tp-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,0.08)}
.tp-cover{height:200px;display:flex;align-items:center;justify-content:center;font-size:68px;background:linear-gradient(135deg,#e8f0fb,#fdf6e3)}
.tp-body{padding:18px 20px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,15,15,0.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--card);border-radius:18px;padding:32px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;position:relative;animation:slidein .25s;box-shadow:0 24px 60px rgba(0,0,0,0.18)}
@keyframes slidein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--border);color:var(--fg)}
.modal-avatar{font-size:56px;margin-bottom:16px}
.modal-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--fg);margin-bottom:4px}
.modal-role{font-size:13px;color:var(--primary);font-weight:600;margin-bottom:14px;line-height:1.5}
.modal-section{margin-top:18px}
.modal-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:8px}
.modal-text{font-size:13px;color:var(--fg);line-height:1.8;white-space:pre-line}

/* FOOTER */
footer{background:var(--fg);color:rgba(255,255,255,0.6);padding:52px 32px 24px}
.footer-inner{max-width:1120px;margin:0 auto}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px;margin-bottom:36px}
@media(max-width:700px){.footer-grid{grid-template-columns:1fr}}
.footer-brand{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:10px}
.footer-desc{font-size:13px;line-height:1.7;max-width:280px}
.footer-heading{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.4);margin-bottom:12px}
.footer-link{display:block;font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:8px;background:none;border:none;text-align:left;transition:color .2s;font-family:inherit}
.footer-link:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.08);padding-top:20px;font-size:12px;text-align:center}

/* DIVIDER */
.divider{text-align:center;margin:48px 0 0;color:var(--border);font-size:20px;letter-spacing:6px}

/* HOME STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-number{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:var(--primary);line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}

/* HOI PHU NU HERO */
.hpn-banner{background:linear-gradient(135deg,var(--primary) 0%,#1a3a80 100%);color:#fff;padding:72px 32px;text-align:center;position:relative;overflow:hidden}
.hpn-banner::after{content:'🌸';position:absolute;font-size:200px;opacity:0.04;right:-30px;top:-30px;line-height:1}

/* EMPTY STATE */
.empty{text-align:center;padding:72px 24px}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:0.5}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--fg);margin-bottom:8px}
.empty-desc{font-size:14px;color:var(--muted)}

/* GIFT FLOAT */
.gift-float{position:fixed;bottom:28px;right:28px;z-index:90;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#fff;border:none;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(200,146,42,0.4);transition:transform .2s}
.gift-float:hover{transform:scale(1.12) rotate(-10deg)}

/* VIEW MORE BTN */
.view-more{text-align:center;margin-top:36px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ============================================================
   ██████╗  █████╗ ████████╗ █████╗
   ██╔══██╗██╔══██╗╚══██╔══╝██╔══██╗
   ██║  ██║███████║   ██║   ███████║
   ██║  ██║██╔══██║   ██║   ██╔══██║

   ╚═════╝ ╚═╝  ╚═╝   ╚═╝   ╚═╝  ╚═╝

   ╔══════════════════════════════════════════╗

   ║   Chỉ chỉnh phần DATA bên dưới,         ║
   ║   KHÔNG cần đụng vào phần code còn lại  ║
   ╚══════════════════════════════════════════╝
   ============================================================ */

/* ----------------------------------------------------------
   1. GƯƠNG SÁNG
   Để thêm người mới: copy một object {...} và điền thông tin
   Trường "anh": đường dẫn tới ảnh (đặt ảnh vào thư mục /anh/)
   Trường "noi_bat": true = hiện badge ⭐ Nổi bật
   ---------------------------------------------------------- */
const DATA_GUONG_SANG = [
  {
    id: 1,

    mo_ta: "Đồng chí Lê Thị Thùy Hương luôn tiên phong trong các phong trào thi đua yêu nước, vận động hội viên tích cực học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh. Với tinh thần trách nhiệm cao, đồng chí đã xây dựng và duy trì nhiều mô hình hay, cách làm sáng tạo, góp phần nâng cao đời sống vật chất và tinh thần cho phụ nữ địa phương.",
    chi_tiet: ""
  },
  {
    id: 2,
    ten: "Lê Thị Thùy Hương",
    chuc_danh: "Chi hội trưởng Phụ nữ ấp Suối Lê, xã Bầu Lâm\nĐảng viên hoàn thành xuất sắc nhiệm vụ — Chi hội đạt thành tích xuất sắc năm 2025",
    loai: "Cá Nhân",
    nam: 2025,
    noi_bat: false,
    anh: null,
    mo_ta: "Gương mẫu học tập theo tư tưởng Hồ Chí Minh, lối sống giản dị, chân thành, luôn bám sát địa bàn và lắng nghe tâm tư của hội viên. Duy trì tổ tiết kiệm 20 triệu đồng, xây dựng mô hình \"Ngôi nhà xanh không đồng\" và lập CLB dân vũ 8 thành viên.",
    chi_tiet: `Phẩm chất
Gương mẫu học tập theo tư tưởng Hồ Chí Minh, lối sống giản dị, chân thành, luôn bám sát địa bàn và lắng nghe tâm tư của hội viên.

Hoạt động nổi bật

• Hỗ trợ đắc lực công tác bầu cử tại ấp

An sinh xã hội
• Vận động mạnh thường quân tặng học bổng cho con em hội viên
• Tích cực tham gia cứu trợ đồng bào bị thiên tai

Mô hình điểm
• Tổ tiết kiệm 20 triệu đồng (giúp 2 chị phát triển kinh tế)
• Mô hình "Ngôi nhà xanh không đồng"
• CLB dân vũ 8 thành viên

Phương hướng 2026
Phấn đấu xây dựng nông thôn mới kiểu mẫu qua các mô hình "Gia đình 5 không 3 sạch 3 an", "100% tham gia BHYT" và phong trào "Dân vận khéo".`
  },

  {
    id: 3,
    ten: "Họ và tên",
    chuc_danh: "Chức vụ / Đơn vị",

/* ----------------------------------------------------------
   2. HÀNH TRÌNH LỊCH SỬ
   Các category hợp lệ: "Cuộc Đời" | "Sự Nghiệp" | "Tư Tưởng" | "Di Sản"

function Modal({ item, onClose }) {

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal-box">
        <button className="modal-close" onClick={onClose}>✕</button>
        {item._type === "guong" && (
          <>
            <div className="modal-avatar">{item.anh ? null : "👩"}</div>
            {item.anh && <img src={item.anh} alt={item.ten} style={{width:80,height:80,borderRadius:"50%",objectFit:"cover",objectPosition:"top",marginBottom:16,border:"3px solid #e0ddd5"}} onError={e=>e.target.style.display='none'}/>}

            <div className="modal-role" style={{whiteSpace:"pre-line"}}>{item.chuc_danh}</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
              <span className="tag">{item.loai}</span>
              <span className="tag tag-gold">Năm {item.nam}</span>
              {item.noi_bat && <span className="tag" style={{background:"#fef3c7",color:"#92400e"}}>⭐ Nổi bật</span>}
            </div>
            <div className="modal-section">
              <div className="modal-section-label">Giới thiệu</div>
              <div className="modal-text">{item.mo_ta}</div>
            </div>
            {item.chi_tiet && (
              <div className="modal-section">

                <div className="modal-text">{item.chi_tiet}</div>

          </>

          <>
            <div style={{fontSize:56,marginBottom:16}}>{item.bieu_tuong}</div>

// Timeline zigzag SVG preview (home)
function TimelinePreview({ onViewAll }) {
  const pts = DATA_HANH_TRINH.slice(0, 10);
  const W=900, PAD=50;
  const step = (W - PAD*2) / (pts.length - 1);
  const ys = [65,120,60,125,60,120,65,120,65,120];
  const polyline = pts.map((_,i) => `${PAD+i*step},${ys[i]}`).join(" ");
  const dotColors = { "Cuộc Đời":"#1a4fa0","Sự Nghiệp":"#16a34a","Tư Tưởng":"#7c3aed","Di Sản":"#c8922a" };
  return (
    <div className="timeline-preview">
      <svg viewBox="0 0 900 200" style={{minWidth:900,width:"100%",display:"block",height:200}}>
        <polyline points={polyline} fill="none" stroke="#1a4fa0" strokeWidth="1.5" strokeDasharray="6 4" opacity="0.4"/>
        {pts.map((p,i) => {
          const x = PAD + i*step, y = ys[i];
          const top = y < 100;
          return (
            <g key={p.id} style={{cursor:"pointer"}} onClick={onViewAll}>
              <circle cx={x} cy={y} r={8} fill={dotColors[p.cat]||"#1a4fa0"} stroke="#fff" strokeWidth={2}/>
              <circle cx={x} cy={y} r={12} fill="none" stroke={dotColors[p.cat]||"#1a4fa0"} strokeWidth={1} opacity={0.3}/>
              <text x={x} y={top ? y-18 : y+22} textAnchor="middle" fontSize={11} fontWeight="700" fill="#1a4fa0" fontFamily="'Be Vietnam Pro',sans-serif">{p.ngan}</text>
              <text x={x} y={top ? y-30 : y+34} textAnchor="middle" fontSize={9} fill="#6b6b60" fontFamily="'Be Vietnam Pro',sans-serif">
                {p.tieu_de.length > 20 ? p.tieu_de.slice(0,18)+"…" : p.tieu_de}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function GuongSang({ openModal }) {
  const [filter, setFilter] = useState("Tất Cả");
  const filters = ["Tất Cả", "Cá Nhân", "Tập Thể"];
  const list = filter === "Tất Cả" ? DATA_GUONG_SANG : DATA_GUONG_SANG.filter(i => i.loai === filter);
  return (
    <div className="section">
      <div className="section-header">
        <div className="eyebrow">👤 Gương điển hình</div>
        <h2 className="section-title">Gương Sáng Bầu Lâm</h2>
        <p className="section-desc">Những cá nhân và tập thể tiêu biểu học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh.</p>
      </div>
      <div className="tabs">
        {filters.map(f => <button key={f} className={`tab-btn${filter===f?" active":""}`} onClick={() => setFilter(f)}>{f}</button>)}

      {list.length === 0
        ? <div className="empty"><div className="empty-icon">👩</div><div className="empty-title">Chưa có dữ liệu</div><div className="empty-desc">Thêm gương sáng trong mục DATA_GUONG_SANG ở đầu file.</div></div>
        : <div className="grid-3">{list.map(item => <GuongCard key={item.id} item={item} onClick={openModal}/>)}</div>
      }
    </div>
  );
}

function HanhTrinh() {
  const [filter, setFilter] = useState("Tất Cả");
  const cats = ["Tất Cả", "Cuộc Đời", "Sự Nghiệp", "Tư Tưởng", "Di Sản"];
  const list = filter === "Tất Cả" ? DATA_HANH_TRINH : DATA_HANH_TRINH.filter(i => i.cat === filter);
  return (
    <div className="section" style={{maxWidth:960}}>
      <div className="section-header">
        <div className="eyebrow eyebrow-gold">📜 Dòng thời gian</div>
        <h2 className="section-title">Hành Trình Của Chủ Tịch Hồ Chí Minh</h2>
        <p className="section-desc">Các mốc quan trọng trong cuộc đời và sự nghiệp của Chủ tịch Hồ Chí Minh.</p>
      </div>
      <div className="tabs">
        {cats.map(c => <button key={c} className={`tab-btn${filter===c?" active":""}`} onClick={() => setFilter(c)}>{c}</button>)}
      </div>
      <div className="vtl">
        {list.map((item, idx) => <VTItem key={item.id} item={item} idx={idx}/>)}
      </div>
    </div>
  );
}

function TacPham({ openModal }) {
  const [filter, setFilter] = useState("Tất Cả");
  const cats = ["Tất Cả", "Thơ Ca", "Văn Xuôi", "Nhật Ký", "Diễn Văn", "Truyện Ngắn", "Khác"];
  const list = filter === "Tất Cả" ? DATA_TAC_PHAM : DATA_TAC_PHAM.filter(i => i.the_loai === filter);
  return (
    <div className="section">
      <div className="section-header">

      <div className="tabs">
        {cats.map(c => <button key={c} className={`tab-btn${filter===c?" active":""}`} onClick={() => setFilter(c)}>{c}</button>)}

function HoiPhuNu() {
  const [filter, setFilter] = useState("Tất Cả");
  const cats = ["Tất Cả","Hoạt Động","Tin Tức","Thông Báo","Phong Trào"];

      </div>
      <div className="section">

                    <div className="card-desc">{item.mo_ta}</div>

      </div>
    </div>
  );
}

// ============ APP ROOT ============
function App() {
  const [page, setPage] = useState("trang-chu");
  const [modal, setModal] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);

  const goTo = (p) => { setPage(p); setMenuOpen(false); window.scrollTo({top:0,behavior:"smooth"}); };
  const openModal = (item) => setModal(item);
  const closeModal = () => setModal(null);

  return (
    <>
      {/* NAV */}
      <nav className="nav">
        <div className="nav-brand" style={{cursor:"pointer"}} onClick={() => goTo("trang-chu")}>
          <span className="nav-brand-main">Di Sản Hồ Chí Minh</span>
          <span className="nav-brand-sub">Hội Phụ Nữ Bầu Lâm</span>
        </div>
        <div className="nav-links">
          {PAGES.map((p,i) => (
            <button key={p} className={`nav-btn${page===p?" active":""}`} onClick={() => goTo(p)}>{PAGE_LABELS[i]}</button>
          ))}
        </div>
        <button className="hamburger" onClick={() => setMenuOpen(o => !o)}>☰</button>
      </nav>

      {/* MOBILE MENU */}
      <div className={`mobile-menu${menuOpen?" open":""}`}>
        {PAGES.map((p,i) => (
          <button key={p} className={`mobile-btn${page===p?" active":""}`} onClick={() => goTo(p)}>{PAGE_LABELS[i]}</button>
        ))}
      </div>

      {/* PAGES */}
      <div className="page">
        {page === "trang-chu"  && <TrangChu goTo={goTo} openModal={openModal}/>}
        {page === "guong-sang" && <GuongSang openModal={openModal}/>}
        {page === "hanh-trinh" && <HanhTrinh/>}
        {page === "tac-pham"   && <TacPham openModal={openModal}/>}
        {page === "hoi-phu-nu" && <HoiPhuNu/>}
      </div>

      {/* FOOTER */}
      <footer>
        <div className="footer-inner">
          <div className="footer-grid">
            <div>
              <div className="footer-brand">Di Sản Hồ Chí Minh</div>
              <div className="footer-desc">Những hoạt động ý nghĩa của Hội trong hành trình học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh tại xã Bầu Lâm.</div>
            </div>
            <div>
              <div className="footer-heading">Liên Kết Nhanh</div>
              {PAGES.map((p,i) => <button key={p} className="footer-link" onClick={() => goTo(p)}>{PAGE_LABELS[i]}</button>)}
            </div>
            <div>
              <div className="footer-heading">Chính Sách</div>
              <button className="footer-link">Chính Sách Bảo Mật</button>
              <button className="footer-link">Điều Khoản Sử Dụng</button>
              <button className="footer-link">Liên Hệ Ban Quản Trị</button>
            </div>
          </div>
          <div className="footer-bottom">© {new Date().getFullYear()} Hội Phụ Nữ Bầu Lâm. Tất cả quyền được bảo lưu.</div>
        </div>
      </footer>

      {/* MODAL */}
      {modal && <Modal item={modal} onClose={closeModal}/>}

      {/* GIFT FLOAT */}
      <button className="gift-float" title="Nhận tài liệu miễn phí" onClick={() => alert("Tính năng sẽ sớm ra mắt! 🎁")}>🎁</button>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

.vt-right{padding-left:28px}
.vt-center{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.vt-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--primary);flex-shrink:0;margin-top:4px}
.vt-line{flex:1;width:1px;min-height:20px}
.vt-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:all .2s}
.vt-card:hover{border-color:rgba(26,79,160,0.3);box-shadow:0 6px 20px rgba(26,79,160,0.08)}
.vt-year{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--primary);line-height:1;margin-bottom:6px}
.vt-cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 10px;border-radius:100px;margin-bottom:8px;letter-spacing:0.05em;text-transform:uppercase}
.cat-cd{background:#dbeafe;color:#1d4ed8}
.cat-sn{background:#dcfce7;color:#166534}
.cat-tt{background:#ede9fe;color:#6d28d9}
.cat-ds{background:#fef9c3;color:#854d0e}
.vt-place{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:400}
.vt-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:var(--fg);margin-bottom:8px;line-height:1.3}
.vt-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.vt-note{font-size:12px;color:var(--primary);font-style:italic;padding-left:10px;border-left:2px solid rgba(26,79,160,0.25);line-height:1.6}
@media(max-width:600px){
  .vtl::before{left:24px}
  .vt-row{grid-template-columns:24px 1fr;gap:0}
  .vt-left{display:none}
  .vt-right{padding-left:16px}
  .vt-center{align-items:center}
}

/* FILTER TABS */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.tab-btn{background:none;border:1px solid var(--border);padding:7px 18px;border-radius:100px;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;letter-spacing:0.03em}
.tab-btn:hover,.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* TAC PHAM CARD */
.tp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .25s;cursor:pointer}
.tp-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,0.08)}
.tp-cover{height:200px;display:flex;align-items:center;justify-content:center;font-size:68px;background:linear-gradient(135deg,#e8f0fb,#fdf6e3)}
.tp-body{padding:18px 20px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,15,15,0.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--card);border-radius:18px;padding:32px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;position:relative;animation:slidein .25s;box-shadow:0 24px 60px rgba(0,0,0,0.18)}
@keyframes slidein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--border);color:var(--fg)}
.modal-avatar{font-size:56px;margin-bottom:16px}
.modal-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--fg);margin-bottom:4px}
.modal-role{font-size:13px;color:var(--primary);font-weight:600;margin-bottom:14px;line-height:1.5}
.modal-section{margin-top:18px}
.modal-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:8px}
.modal-text{font-size:13px;color:var(--fg);line-height:1.8;white-space:pre-line}

/* FOOTER */
footer{background:var(--fg);color:rgba(255,255,255,0.6);padding:52px 32px 24px}
.footer-inner{max-width:1120px;margin:0 auto}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px;margin-bottom:36px}
@media(max-width:700px){.footer-grid{grid-template-columns:1fr}}
.footer-brand{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:10px}
.footer-desc{font-size:13px;line-height:1.7;max-width:280px}
.footer-heading{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.4);margin-bottom:12px}
.footer-link{display:block;font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:8px;background:none;border:none;text-align:left;transition:color .2s;font-family:inherit}
.footer-link:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.08);padding-top:20px;font-size:12px;text-align:center}

/* DIVIDER */
.divider{text-align:center;margin:48px 0 0;color:var(--border);font-size:20px;letter-spacing:6px}

/* HOME STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-number{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:var(--primary);line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}

/* HOI PHU NU HERO */
.hpn-banner{background:linear-gradient(135deg,var(--primary) 0%,#1a3a80 100%);color:#fff;padding:72px 32px;text-align:center;position:relative;overflow:hidden}
.hpn-banner::after{content:'🌸';position:absolute;font-size:200px;opacity:0.04;right:-30px;top:-30px;line-height:1}

/* EMPTY STATE */
.empty{text-align:center;padding:72px 24px}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:0.5}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--fg);margin-bottom:8px}
.empty-desc{font-size:14px;color:var(--muted)}

/* GIFT FLOAT */
.gift-float{position:fixed;bottom:28px;right:28px;z-index:90;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#fff;border:none;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(200,146,42,0.4);transition:transform .2s}
.gift-float:hover{transform:scale(1.12) rotate(-10deg)}

/* VIEW MORE BTN */
.view-more{text-align:center;margin-top:36px}

// Timeline zigzag SVG preview (home)
function TimelinePreview({ onViewAll }) {
  const pts = DATA_HANH_TRINH.slice(0, 10);
  const W=900, PAD=50;
  const step = (W - PAD*2) / (pts.length - 1);
  const ys = [65,120,60,125,60,120,65,120,65,120];
  const polyline = pts.map((_,i) => `${PAD+i*step},${ys[i]}`).join(" ");
  const dotColors = { "Cuộc Đời":"#1a4fa0","Sự Nghiệp":"#16a34a","Tư Tưởng":"#7c3aed","Di Sản":"#c8922a" };
  return (
    <div className="timeline-preview">
      <svg viewBox="0 0 900 200" style={{minWidth:900,width:"100%",display:"block",height:200}}>
        <polyline points={polyline} fill="none" stroke="#1a4fa0" strokeWidth="1.5" strokeDasharray="6 4" opacity="0.4"/>
        {pts.map((p,i) => {
          const x = PAD + i*step, y = ys[i];
          const top = y < 100;
          return (
            <g key={p.id} style={{cursor:"pointer"}} onClick={onViewAll}>
              <circle cx={x} cy={y} r={8} fill={dotColors[p.cat]||"#1a4fa0"} stroke="#fff" strokeWidth={2}/>
              <circle cx={x} cy={y} r={12} fill="none" stroke={dotColors[p.cat]||"#1a4fa0"} strokeWidth={1} opacity={0.3}/>
              <text x={x} y={top ? y-18 : y+22} textAnchor="middle" fontSize={11} fontWeight="700" fill="#1a4fa0" fontFamily="'Be Vietnam Pro',sans-serif">{p.ngan}</text>
              <text x={x} y={top ? y-30 : y+34} textAnchor="middle" fontSize={9} fill="#6b6b60" fontFamily="'Be Vietnam Pro',sans-serif">
                {p.tieu_de.length > 20 ? p.tieu_de.slice(0,18)+"…" : p.tieu_de}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

  const [modal, setModal] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);

  const goTo = (p) => { setPage(p); setMenuOpen(false); window.scrollTo({top:0,behavior:"smooth"}); };
  const openModal = (item) => setModal(item);
  const closeModal = () => setModal(null);

  return (
    <>
      {/* NAV */}
      <nav className="nav">
        <div className="nav-brand" style={{cursor:"pointer"}} onClick={() => goTo("trang-chu")}>
          <span className="nav-brand-main">Di Sản Hồ Chí Minh</span>
          <span className="nav-brand-sub">Hội Phụ Nữ Bầu Lâm</span>
        </div>
        <div className="nav-links">
          {PAGES.map((p,i) => (
            <button key={p} className={`nav-btn${page===p?" active":""}`} onClick={() => goTo(p)}>{PAGE_LABELS[i]}</button>
          ))}
        </div>
        <button className="hamburger" onClick={() => setMenuOpen(o => !o)}>☰</button>
      </nav>

      {/* MOBILE MENU */}
      <div className={`mobile-menu${menuOpen?" open":""}`}>
        {PAGES.map((p,i) => (
          <button key={p} className={`mobile-btn${page===p?" active":""}`} onClick={() => goTo(p)}>{PAGE_LABELS[i]}</button>
        ))}
      </div>

      {/* PAGES */}
      <div className="page">
        {page === "trang-chu"  && <TrangChu goTo={goTo} openModal={openModal}/>}
        {page === "guong-sang" && <GuongSang openModal={openModal}/>}
        {page === "hanh-trinh" && <HanhTrinh/>}
        {page === "tac-pham"   && <TacPham openModal={openModal}/>}
        {page === "hoi-phu-nu" && <HoiPhuNu/>}
      </div>

      {/* FOOTER */}
      <footer>
        <div className="footer-inner">
          <div className="footer-grid">
            <div>
              <div className="footer-brand">Di Sản Hồ Chí Minh</div>
              <div className="footer-desc">Những hoạt động ý nghĩa của Hội trong hành trình học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh tại xã Bầu Lâm.</div>
            </div>
            <div>
              <div className="footer-heading">Liên Kết Nhanh</div>
              {PAGES.map((p,i) => <button key={p} className="footer-link" onClick={() => goTo(p)}>{PAGE_LABELS[i]}</button>)}
            </div>
            <div>
              <div className="footer-heading">Chính Sách</div>
              <button className="footer-link">Chính Sách Bảo Mật</button>
              <button className="footer-link">Điều Khoản Sử Dụng</button>
              <button className="footer-link">Liên Hệ Ban Quản Trị</button>
            </div>
          </div>
          <div className="footer-bottom">© {new Date().getFullYear()} Hội Phụ Nữ Bầu Lâm. Tất cả quyền được bảo lưu.</div>
        </div>
      </footer>

      {/* MODAL */}
      {modal && <Modal item={modal} onClose={closeModal}/>}

      {/* GIFT FLOAT */}
      <button className="gift-float" title="Nhận tài liệu miễn phí" onClick={() => alert("Tính năng sẽ sớm ra mắt! 🎁")}>🎁</button>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
